[package]
name = "aicortex"
version = "0.1.0"
description = "Persistent, governed memory for AI clients: one cell on the rahi chassis"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.spec-spine]
spec = "010-chassis-adoption-and-workspace"

# The cell is the library root so that tests/cell.rs can hold `Aicortex` to
# its declarations; the binary is the one line of B-3 (D-4).
[lib]
path = "src/cell.rs"

[[bin]]
name = "aicortex"
path = "src/main.rs"

[dependencies]
aicortex-store = { workspace = true }
rahi-cli = { workspace = true }
rahi-edge = { workspace = true }
rahi-store = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
rahi-kernel = { workspace = true }
rahi-types = { workspace = true }
rahi-ops = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
