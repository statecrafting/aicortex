# Version-pin bumps self-waive the coupling gate (spec-spine's
# auto_waive_dependency_only), so these PRs need no spec edit. A workspace
# cargo bump still stales the committed codebase index until spec-spine
# projects the root manifest (spec 001 D-15, D-16): the governance gate
# judges every commit's own tree, so such a PR is rebuilt as one commit that
# carries the bump and the regenerated index, then force-pushed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # No npm anywhere in this repository (spec 001 D-1), so no npm entry.
  # The cargo entry reports "no manifest" until spec 010 lands Cargo.toml.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The nine chassis crates move together at one exact version (spec 010
    # B-2, spec 046 B-1), so a rahi release arrives as one pull request.
    groups:
      rahi:
        patterns:
          - "rahi-*"
      # Every other crate in one weekly pull request, as spec-spine groups
      # its own, so the rebuild above is paid once a week (D-15).
      cargo:
        patterns:
          - "*"
