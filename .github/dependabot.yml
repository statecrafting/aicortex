# Version-pin bumps self-waive the coupling gate (spec-spine's
# auto_waive_dependency_only), so these PRs need no spec edit.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # No npm anywhere in this repository (spec 001 D-1), so no npm entry.
  # The cargo entry reports "no manifest" until spec 010 lands Cargo.toml.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The nine chassis crates move together at one exact version (spec 010
    # B-2, spec 046 B-1), so a rahi release arrives as one pull request.
    groups:
      rahi:
        patterns:
          - "rahi-*"
