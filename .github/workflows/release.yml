# Spec: specs/055-release-and-crate-publication/spec.md
#
# The release check on every pull request that touches a publishable crate
# (B-7), and publication from an annotated tag a human pushed (B-1). Nothing
# here creates or moves a tag. The publish job runs in the `release`
# environment, whose protection rules require a human approval and which is
# the only holder of the registry token (B-9); a pull-request run never
# reaches it.

name: release

on:
  pull_request:
    paths:
      - "crates/aicortex-types/**"
      - "crates/aicortex-claims/**"
      - "crates/aicortex-gate/**"
      - "crates/aicortex-store/**"
      - "crates/aicortex-embed/**"
      - "fixtures/external-host/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/release-check.sh"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: release check
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # The whole history and every tag, so the guard can read the tag object
      # and decide whether its commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, installed explicitly so a
      # runner image without it fails here with a toolchain error.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal
          cargo --version
      # The tag object itself, fetched again: a checkout of a tag can leave a
      # lightweight ref in its place, and the guard must judge what was
      # pushed. The repository is public, so no credential is needed.
      - name: Guard the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          scripts/release-check.sh --guard-tag "$TAG" --main-ref origin/main
      - name: Release check
        run: scripts/release-check.sh
      - name: Release check self-test
        run: scripts/release-check.sh --self-test

  publish:
    name: publish
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The toolchain rust-toolchain.toml pins, installed explicitly so a
      # runner image without it fails here with a toolchain error.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal
          cargo --version
      # Judged again in this job, at the commit this job checked out, so the
      # approval that released the token approved the tag the guard passed.
      - name: Guard the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          scripts/release-check.sh --guard-tag "$TAG" --main-ref origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG}^{commit}")"
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/release-check.sh --publish
