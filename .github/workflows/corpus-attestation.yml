name: corpus attestation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  attest:
    name: corpus attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install spec-spine
        run: |
          set -euo pipefail
          sh scripts/statecraft/install-spec-spine.sh
          echo "$PWD/.bin" >> "$GITHUB_PATH"
      - run: spec-spine attest --with-coupling > corpus-attestation.json
      - uses: actions/upload-artifact@v7
        with:
          name: corpus-attestation-${{ github.sha }}
          path: corpus-attestation.json
