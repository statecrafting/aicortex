name: corpus attestation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  attest:
    name: corpus attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install spec-spine
        run: |
          set -euo pipefail
          sh scripts/statecraft/install-spec-spine.sh
          echo "$PWD/.bin" >> "$GITHUB_PATH"
      - run: spec-spine attest --with-coupling > corpus-attestation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-attestation-${{ github.sha }}
          path: corpus-attestation.json
