name: spec DAG

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dag:
    name: spec DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install spec-spine
        run: |
          set -euo pipefail
          sh scripts/statecraft/install-spec-spine.sh
          echo "$PWD/.bin" >> "$GITHUB_PATH"
      - run: scripts/spec-dag.sh
