[package]
name = "aicortex-api"
version = "0.1.0"
description = "The Aicortex HTTP API: bearer-authorized, scope-gated, mounted into rahi's edge"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.spec-spine]
spec = "020-http-api-and-scopes"

[dependencies]
aicortex-gate = { workspace = true }
aicortex-recall = { workspace = true }
aicortex-store = { workspace = true }
aicortex-types = { workspace = true }
rahi-edge = { workspace = true }
rahi-idp = { workspace = true }
rahi-kernel = { workspace = true }
rahi-ledger = { workspace = true }
rahi-store = { workspace = true }
rahi-types = { workspace = true }
axum = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
aicortex-embed = { workspace = true }
base64 = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }

[lints]
workspace = true
