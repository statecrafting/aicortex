[package]
name = "aicortex-mcp"
version = "0.1.0"
description = "The Aicortex MCP server: streamable HTTP, seven tools, authorized by the chassis's resource server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.spec-spine]
spec = "021-mcp-server"

[dependencies]
aicortex-api = { workspace = true }
rahi-edge = { workspace = true }
rahi-idp = { workspace = true }
rahi-types = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tower = { workspace = true }

[dev-dependencies]
aicortex-embed = { workspace = true }
aicortex-recall = { workspace = true }
aicortex-types = { workspace = true }
base64 = { workspace = true }
rahi-kernel = { workspace = true }
rahi-ledger = { workspace = true }
rahi-store = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
reqwest = { workspace = true }
ring = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }
aicortex-store = { workspace = true }

[lints]
workspace = true
