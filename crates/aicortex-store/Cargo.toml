[package]
name = "aicortex-store"
version = "0.1.0"
description = "The tables and the only code allowed to touch them: ordered migrations, scope-predicated repositories, counters, and a signed keyset cursor"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.spec-spine]
spec = "012-store-schema-and-repositories"

# The territory (spec 012 section 2): the record of 011, the chassis's store
# and its error type, the serde wire the record is stored in (D-3), and the
# two primitives the cursor of B-7 needs. No HTTP client, no second store, no
# runtime: the crate is a library of statements and reads, and the runtime is
# whoever calls it.
[dependencies]
# The write gate of spec 013, for its `Admitted` type alone. `MemoryRepo::insert`
# takes one, which is how 013 B-1 makes "nothing is written that did not pass a
# verdict" a compile-time property rather than a convention. The edge points
# store -> gate and never back: the gate is pure and depends on the record of
# 011 only.
aicortex-gate = { workspace = true }
# The registry rule of spec 050 (FR-005), pure: the predicate registry
# repository reads the stored documents into its snapshot and asks it.
aicortex-claims = { workspace = true }
aicortex-types = { workspace = true }
rahi-store = { workspace = true }
rahi-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ring = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }

# The tests open rahi's single-voter node in a throwaway directory (FR-001)
# and need a multi-thread runtime to drive it.
[dev-dependencies]
# Spec 050 B-15: the registration test appends the Decision it stages.
rahi-ledger = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
