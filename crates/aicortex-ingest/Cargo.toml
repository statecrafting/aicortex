[package]
name = "aicortex-ingest"
version = "0.1.0"
description = "Source adapters for Aicortex: one contract, one runner, incremental and resumable"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.spec-spine]
spec = "030-source-adapter-framework"

# The territory (spec 030 section 2): the record of 011, the write gate of 013
# and the store's repositories, rahi's ledger and kernel for the Decisions and
# the governed egress facade, and the HTTP handlers of the run routes. Intake
# sits above the surfaces in spec 002's layering, so this crate depends
# downward on aicortex-api for the scope gate, the errors, the caller and the
# event bus, and the app hands its routes to the API's extension seam (as 023
# D-2 does for curation). Nothing here opens a socket of its own: an adapter
# brings its own transport, and reaches a host only through the kernel's
# egress facade (B-6).
[dependencies]
aicortex-api = { workspace = true }
aicortex-gate = { workspace = true }
aicortex-store = { workspace = true }
aicortex-types = { workspace = true }
rahi-kernel = { workspace = true }
rahi-ledger = { workspace = true }
rahi-store = { workspace = true }
rahi-types = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
uuid = { workspace = true }

[dev-dependencies]
# The run routes' test shares aicortex-api's test harness (tests/routes.rs),
# which builds an embedding provider and a bearer-authenticated edge.
aicortex-embed = { workspace = true }
base64 = { workspace = true }
rahi-edge = { workspace = true }
rahi-idp = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
reqwest = { workspace = true }
ring = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }

[lints]
workspace = true
