# The aicortex workspace (spec 010 B-1). Every third-party and rahi version
# lives in [workspace.dependencies]; a crate manifest inherits it with
# `workspace = true`, and adding a dependency is an `extends` edge on this
# section.

[workspace]
# The binary lives under apps/, the libraries under crates/ (spec 002
# section 4). Both globs are declared from the start so adding a library is
# a new directory and not a manifest edit.
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/statecrafting/aicortex"
authors = ["Bartek Kus"]

[workspace.dependencies]
# The chassis (B-2): all nine crates at one exact version, from the registry
# only. No [patch], no path, no git (D-1, D-2). Spec 046 established the
# all-nine-together adoption; spec 014 moves them to released rahi v0.4.0.
# A chassis bump is a single change to
# these nine lines that revisits deny.toml with it (D-8).
rahi-types = "=0.4.0"
rahi-store = "=0.4.0"
rahi-ledger = "=0.4.0"
rahi-kernel = "=0.4.0"
rahi-idp = "=0.4.0"
rahi-edge = "=0.4.0"
rahi-ops = "=0.4.0"
rahi-harness = "=0.4.0"
rahi-cli = "=0.4.0"

# The router type the Cell returns (B-3). The chassis's edge is built on it,
# and this is the version rahi locks, so the workspace adds no second copy
# of the HTTP stack.
axum = "0.8"

# Tests only: the B-2 test reads Cargo.toml files, and the preflight test
# needs a data directory that is empty and disposable. Both match the
# versions and features rahi's tree already carries.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tempfile = "3"

# The record's own substrate (spec 011). `serde` is the only shape library
# the types crate carries, and `uuid` is there for the v7 identifier of
# 011 B-1; the chassis already locks both, so neither adds a tree.
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", default-features = false, features = ["std", "v7", "serde"] }

# The workspace's own libraries, declared here for the same reason the
# third-party ones are: one place says what a name resolves to, and a member
# inherits it with `workspace = true`.
# The version is spelled out beside the path because `cargo deny`'s wildcard
# rule refuses a dependency with no requirement at all, and a workspace member
# without one is a `*`.
aicortex-types = { path = "crates/aicortex-types", version = "=0.1.0" }
aicortex-store = { path = "crates/aicortex-store", version = "=0.1.0" }
aicortex-gate = { path = "crates/aicortex-gate", version = "=0.1.0" }
aicortex-claims = { path = "crates/aicortex-claims", version = "=0.1.0" }

# The family's secret detector registry (spec 047): aicortex-gate consumes
# its tables and scan instead of keeping its own. Exact pin, as the chassis
# is (047 B-4); default features only, so no `regex` (action-gate 001 D-1).
# `golden-vectors` is enabled by aicortex-gate's tests alone.
action-gate-core = { version = "=0.2.0", default-features = false }

# The wire the round-trip fixtures of 011 are written in, and the canonical
# form spec 012 D-3 stores a memory record as. The chassis locks it already.
serde_json = "1"

# The store's two primitives (spec 012). `ring` signs the keyset cursor of
# 012 B-7 and digests the scope id and the fingerprint; `base64` renders the
# cursor as the opaque base64url string B-7 requires. Both are already in the
# chassis's locked tree at these versions (rahi-idp and rahi-ops carry them),
# so neither adds a tree and `deny.toml`'s single-version rule for `ring`
# still holds.
ring = "0.17"
base64 = "0.23"

# The content fingerprint of spec 014 B-1. BLAKE3 rather than a second call
# into `ring`, because B-1 names it: it is a tree hash with a published,
# stable definition, and the value it produces is written into a unique index
# that a later version may not silently reinterpret. It is not a keyed digest
# and never reaches the decision chain; the chain's digests are the HMAC of
# spec 013 B-9, whose key erasure destroys.
blake3 = { version = "1", default-features = false, features = ["std"] }

# The gate's one shape library (spec 013 B-8). Unicode NFC is a table, not an
# algorithm anyone should retype, and this is the crate `rustc` itself uses
# for it. The gate takes nothing else: no regex engine, because the detectors
# of B-4 are a data table scanned by hand, and no float, because the entropy
# of B-4 is computed in fixed-point integers (D-4).
unicode-normalization = "0.1"

# Tests only: `trybuild` runs the compile-fail cases that prove a type cannot
# be built (011 FR-003), and `tokio` drives the async store tests of 012
# against rahi's single-voter node.
trybuild = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
# Allowed only at the crate roots of aicortex-index and aicortex-recall,
# each with one documented `allow` (B-1).
float_arithmetic = "deny"
